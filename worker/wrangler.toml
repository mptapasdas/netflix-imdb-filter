name = "netflix-imdb-proxy"
main = "src/index.js"
compatibility_date = "2026-08-01"

[[kv_namespaces]]
binding = "RATINGS_KV"
id = "4012d3970e0349498a1590c038121811"

# Native Workers rate limiting — 50 requests per 60s per key (we key by client IP).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5000, period = 60 }
